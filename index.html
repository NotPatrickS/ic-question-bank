<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC 刷题 · 个人题库</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">IC 题库</a>
  <nav class="nav">
    <a href="#/" data-nav="home">我的学习</a>
    <a href="#/roadmap" data-nav="roadmap">路线图</a>
    <a href="#/daily" data-nav="daily">每日打卡</a>
    <a href="#/wrong" data-nav="wrong">错题本</a>
    <a href="#/stats" data-nav="stats">统计</a>
  </nav>
  <form class="searchbox" id="searchForm">
    <input id="searchInput" type="text" placeholder="搜索题目、标签" autocomplete="off">
  </form>
  <button class="account-btn" id="accountBtn">登录</button>
  <span class="sync-status" id="syncStatus"></span>
</header>

<main id="app"></main>

<footer class="footer">数据保存在本机浏览器 · <a href="#/stats">统计与清空</a></footer>
<footer class="legal">IC 题库 · 纯静态个人项目</footer>

<script src="js/data.js?v=2"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js?v=3"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js?v=3"></script>
<script>
  // 顶栏账号按钮 + 启动时恢复会话
  document.getElementById("accountBtn").addEventListener("click", () => Cloud.openAuthModal());
  Cloud.init().then(u => {
    if (u) {
      // 会话恢复：以云端为准拉取一次（避免多设备时间差导致旧数据覆盖新数据）
      Cloud.pullOnBoot().then(() => { if (location.hash) router(); });
    }
  });
</script>
</body>
</html>
